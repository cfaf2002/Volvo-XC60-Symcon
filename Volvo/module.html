<style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { font-family: 'Poppins', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; -webkit-font-smoothing: antialiased;
           /* Farbschema „Symcon-Design“: Schrift- und Akzentfarbe der gewählten Visualisierung */
           color: var(--content-color, inherit); --accent: var(--accent-color, #2e86de); }
    /* Feste Farbschemas (Eigenschaft „Farbschema“ der Instanz) */
    body.theme-dark  { color: #eef1f4; --accent: #2e86de; background: linear-gradient(180deg, #23262b, #1a1c20); }
    body.theme-light { color: #1f2a33; --accent: #1f6fb8; background: linear-gradient(180deg, #f6f8fa, #e9eef2); }
    body.theme-light .vx { --line: rgba(31,42,51,.14); --muted: rgba(31,42,51,.62); }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* Bewegung sparen: auf Wunsch des Systems und solange die Kachel nicht sichtbar ist */
    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation: none !important; transition: none !important; }
    }
    body.paused *, body.paused *::before, body.paused *::after { animation-play-state: paused !important; }

    /* Hintergrundbild (optional) */
    .vx-bg { position: fixed; inset: 0; z-index: -2; background: center / cover no-repeat; display: none; }
    .vx-shade { position: fixed; inset: 0; z-index: -1; display: none;
                background: linear-gradient(180deg, rgba(0,0,0,var(--dim)) 0%, rgba(0,0,0,calc(var(--dim) + .12)) 100%); }
    body.has-bg .vx-bg, body.has-bg .vx-shade { display: block; }
    body.has-bg { color: #fff; }
    body.has-bg .vx { --line: rgba(255,255,255,.16); --muted: rgba(255,255,255,.72); }
    body.has-bg .vx-panel { background: rgba(20,22,26,.38); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
                            border: 1px solid rgba(255,255,255,.1); border-radius: 16px; padding: clamp(12px, 2vh, 22px) clamp(14px, 2vw, 24px); }
    body.has-bg .vx-track { stroke: rgba(255,255,255,.18); }

    .vx {
        --c: #95a5a6;       /* Farbe des Akkustands */
        --s: #95a5a6;       /* Farbe des Ladestatus */
        --line: rgba(127,127,127,.18);
        --muted: rgba(127,127,127,.95);
        height: 100vh;
        padding: 52px clamp(14px, 3vw, 40px) clamp(12px, 2vh, 24px);
        display: grid; grid-template-rows: auto 1fr; gap: clamp(8px, 2vh, 20px);
        overflow: hidden;
    }

    /* Kopfzeile */
    .vx-head { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .vx-status { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; white-space: nowrap; }
    .vx-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--s); box-shadow: 0 0 0 4px color-mix(in srgb, var(--s) 22%, transparent); }
    .vx.charging .vx-dot { animation: pulse 1.6s ease-in-out infinite; }
    .vx-model { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .vx-updated { margin-left: auto; font-size: 11px; color: var(--muted); white-space: nowrap; }
    .vx-updated.err { color: #e74c3c; }

    /* Hauptbereich */
    .vx-main { min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
               align-items: center; gap: clamp(16px, 4vw, 64px); max-width: 1100px; width: 100%; margin: 0 auto; }

    /* Akku-Ring */
    .vx-gauge { display: flex; flex-direction: column; align-items: center; min-height: 0; }
    .vx-ring { position: relative; width: min(100%, 50vh, 420px); aspect-ratio: 1; }
    .vx-ring svg { width: 100%; height: 100%; transform: rotate(135deg); overflow: visible; }
    .vx-track { stroke: var(--line); }
    .vx-arc { stroke: var(--c); transition: stroke-dashoffset .9s cubic-bezier(.3,.7,.3,1), stroke .4s; }
    .vx-target { stroke: currentColor; opacity: .55; }
    .vx.charging .vx-arc { animation: glow 1.8s ease-in-out infinite; }
    .vx-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .vx-soc { font-size: clamp(26px, 8.5vmin, 72px); font-weight: 600; line-height: 1; letter-spacing: -1px; font-variant-numeric: tabular-nums; }
    .vx-soc small { font-size: .45em; font-weight: 500; margin-left: 2px; }
    .vx-range { font-size: clamp(11px, 2vmin, 16px); color: var(--muted); margin-top: 6px; }
    .vx-plug { margin-top: 6px; font-size: clamp(10px, 1.6vmin, 13px); color: var(--s); display: none; font-weight: 600; }
    .vx.cable .vx-plug { display: block; }

    /* Fahrzeugbild und Sicherheits-Chips */
    .vx-panel { display: flex; flex-direction: column; min-width: 0; }
    .vx-car { width: 100%; max-height: min(26vh, 220px); object-fit: contain; margin-bottom: clamp(6px, 1.5vh, 14px);
              filter: drop-shadow(0 10px 18px rgba(0,0,0,.35)); display: none; }
    .vx-car.on { display: block; }
    .vx-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: clamp(6px, 1.5vh, 14px); }
    .vx-chip { display: inline-flex; align-items: center; gap: 6px; font-size: clamp(11px, 1.6vmin, 13px); font-weight: 600;
               padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line); white-space: nowrap; }
    .vx-chip svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .vx-chip.ok { color: #2ecc71; border-color: color-mix(in srgb, #2ecc71 40%, transparent); }
    .vx-chip.warn { color: #e67e22; border-color: color-mix(in srgb, #e67e22 45%, transparent); background: color-mix(in srgb, #e67e22 10%, transparent); }
    .vx-chip.hide { display: none; }

    /* Werteliste */
    .vx-row { display: flex; align-items: center; gap: 12px; padding: clamp(8px, 1.5vh, 13px) 0; border-bottom: 1px solid var(--line); min-width: 0; }
    .vx-row:first-of-type { border-top: 1px solid var(--line); }
    .vx-row.hide { display: none; }
    .vx-ico { width: clamp(16px, 2.2vmin, 22px); height: clamp(16px, 2.2vmin, 22px); flex: none; stroke: currentColor; fill: none;
              stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; opacity: .55; }
    .vx-label { font-size: clamp(12px, 1.8vmin, 17px); color: var(--muted); white-space: nowrap; }
    .vx-value { margin-left: auto; text-align: right; font-size: clamp(14px, 2.2vmin, 21px); font-weight: 600; white-space: nowrap;
                overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; min-width: 0; }
    .vx-value small { font-weight: 400; color: var(--muted); font-size: .82em; margin-left: 6px; }
    .vx-value a { color: inherit; text-decoration: none; border-bottom: 1px dotted currentColor; }
    /* Standort zweizeilig: Straße als Link, darunter PLZ/Ort */
    .vx-value.loc { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; line-height: 1.25; }
    .vx-value.loc a, .vx-value.loc small { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .vx-value.loc a { color: var(--accent); text-decoration: underline; text-decoration-style: dotted; text-decoration-thickness: 1px;
                      text-underline-offset: 3px; border-bottom: 0; }
    .vx-value.loc small { margin-left: 0; font-size: .78em; }

    @keyframes pulse { 50% { box-shadow: 0 0 0 7px color-mix(in srgb, var(--s) 0%, transparent); } }
    @keyframes glow { 50% { opacity: .55; } }

    /* ---------- Handy-Ansichten ----------
       Symcon-App: 1x1 ≈ 165x165, 2x1 ≈ 345x165, 2x2 ≈ 345x345 (je nach Gerät) */

    /* Schmal und hoch (z. B. 2x3): untereinander */
    @media (max-width: 640px) {
        .vx-main { grid-template-columns: 1fr; align-content: center; gap: 12px; }
        .vx-ring { width: min(62vw, 34vh, 260px); }
        .vx-car { max-height: 18vh; }
    }
    @media (max-width: 640px) and (max-height: 700px) { .vx-car { display: none !important; } }

    /* Kompakt (2x1 und 2x2): Ring links, Werte rechts */
    @media (min-width: 260px) and (max-height: 300px),
           (min-width: 260px) and (max-width: 640px) and (max-height: 520px) {
        .vx { padding: 46px 12px 10px; gap: 6px; }
        .vx-head { gap: 8px; }
        .vx-model, .vx-car, .vx-plug { display: none !important; }
        .vx-updated { font-size: 10px; }
        .vx-main { grid-template-columns: auto minmax(0, 1fr); align-content: center; gap: clamp(10px, 4vw, 22px); }
        .vx-ring { width: min(42vw, calc(100vh - 82px), 190px); }
        .vx-soc { font-size: clamp(22px, 9vmin, 40px); }
        .vx-range { font-size: 11px; margin-top: 2px; }
        body.has-bg .vx-panel { padding: 8px 12px; border-radius: 12px; }

        .vx-row { display: none; padding: 6px 0; gap: 8px; border-top: 0 !important; }
        .vx-row.core { display: flex; }
        .vx-label { display: none; }
        .vx-value { margin-left: 0; text-align: left; font-size: 14px; }
        .vx-value small { display: none; }
        .vx-value.loc { align-items: flex-start; }

        .vx-chips { order: 9; flex-wrap: nowrap; gap: 5px; margin: 6px 0 0; }
        .vx-chip { padding: 4px 7px; gap: 0; }
        .vx-chip span { display: none; }
        .vx-chip svg { width: 15px; height: 15px; }
    }
    /* 2x1 (flach): Reichweite steht schon unter dem Ring -> nur "Laden" */
    @media (min-width: 260px) and (max-height: 230px) {
        .vx-range, .vx-updated { display: none !important; }
        .vx-row { padding: 4px 0; }
    }
    /* 2x2 (quadratisch): mehr Platz -> Standort und Geöffnet zusätzlich */
    @media (min-width: 260px) and (max-width: 640px) and (min-height: 301px) and (max-height: 520px) {
        .vx-row:not(.hide)#rowLocation, .vx-row#rowOdo { display: flex; }
        .vx-range { display: none; }
    }

    /* 1x1 (klein): nur Status und Akku-Ring */
    @media (max-width: 259px) {
        .vx { padding: 40px 8px 6px; gap: 2px; }
        .vx-model, .vx-updated, .vx-range, .vx-plug, .vx-panel { display: none !important; }
        .vx-status { font-size: 11px; }
        .vx-main { grid-template-columns: 1fr; align-content: center; }
        .vx-ring { width: min(78vw, calc(100vh - 70px)); }
        .vx-soc { font-size: clamp(18px, 15vmin, 34px); }
    }
</style>

<div class="vx-bg" id="bg"></div>
<div class="vx-shade" id="shade"></div>
<div class="vx" id="root">
    <div class="vx-head">
        <span class="vx-status"><span class="vx-dot"></span><span id="status">–</span></span>
        <span class="vx-model" id="model"></span>
        <span class="vx-updated" id="updated"></span>
    </div>

    <div class="vx-main">
        <div class="vx-gauge">
            <div class="vx-ring">
                <svg viewBox="0 0 120 120">
                    <!-- 270°-Bogen: Umfang 2π·52 = 326,7 → 3/4 = 245 -->
                    <circle class="vx-track" cx="60" cy="60" r="52" fill="none" stroke-width="7" stroke-linecap="round" stroke-dasharray="245 327"/>
                    <circle class="vx-arc" id="arc" cx="60" cy="60" r="52" fill="none" stroke-width="7" stroke-linecap="round"
                            stroke-dasharray="245 327" stroke-dashoffset="245"/>
                    <line class="vx-target" id="targetMark" x1="60" y1="3" x2="60" y2="13" stroke-width="1.6" style="display:none"/>
                </svg>
                <div class="vx-center">
                    <div class="vx-soc"><span id="soc">–</span><small>%</small></div>
                    <div class="vx-range" id="range"></div>
                    <div class="vx-plug" id="plug">Ladekabel angeschlossen</div>
                </div>
            </div>
        </div>

        <div class="vx-panel">
            <img class="vx-car" id="car" alt="">

            <div class="vx-chips">
                <span class="vx-chip hide" id="chipLock">
                    <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path id="shackle" d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
                    <span id="lockText"></span>
                </span>
                <span class="vx-chip hide" id="chipDoors">
                    <svg viewBox="0 0 24 24"><path d="M5 21V4a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v17M3 21h18M15 12h.01"/></svg>
                    <span id="doorsText"></span>
                </span>
                <span class="vx-chip hide" id="chipWin">
                    <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M12 4v16M4 12h16"/></svg>
                    <span id="winText"></span>
                </span>
                <span class="vx-chip hide" id="chipHome">
                    <svg viewBox="0 0 24 24"><path d="M3 11 12 4l9 7M5 10v10h14V10"/></svg>
                    <span>Zu Hause</span>
                </span>
            </div>

            <div class="vx-row core" id="rowCharge">
                <svg class="vx-ico" viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>
                <span class="vx-label">Laden</span>
                <span class="vx-value" id="charge">–</span>
            </div>
            <div class="vx-row core" id="rowRange">
                <svg class="vx-ico" viewBox="0 0 24 24"><path d="M4 19h16M6 15l3-8h6l3 8M8 15h8"/></svg>
                <span class="vx-label">Reichweite</span>
                <span class="vx-value" id="rangeRow">–</span>
            </div>
            <div class="vx-row opt hide" id="rowOpen">
                <svg class="vx-ico" viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01M10.3 3.9 2 18a2 2 0 0 0 1.7 3h16.6a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
                <span class="vx-label">Geöffnet</span>
                <span class="vx-value" id="open">–</span>
            </div>
            <div class="vx-row opt hide" id="rowLocation">
                <svg class="vx-ico" viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-12a7 7 0 0 1 14 0c0 5.8-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>
                <span class="vx-label">Standort</span>
                <span class="vx-value loc" id="location">–</span>
            </div>
            <div class="vx-row opt" id="rowOdo">
                <svg class="vx-ico" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 13l4-3M12 5V3"/></svg>
                <span class="vx-label">Kilometerstand</span>
                <span class="vx-value" id="odo">–</span>
            </div>
        </div>
    </div>
</div>

<script>
    const $ = (id) => document.getElementById(id);

    /** Wert mit kleinem Zusatz setzen – nur als Text, nie als HTML */
    function setValue(el, main, small) {
        el.textContent = main;
        if (small) {
            const sm = document.createElement('small');
            sm.textContent = small;
            el.appendChild(sm);
        }
    }

    // Animationen anhalten, solange die Kachel nicht zu sehen ist
    document.addEventListener('visibilitychange', () => document.body.classList.toggle('paused', document.hidden));
    const fmt = (n, d = 0) => Number(n).toLocaleString('de-DE', { minimumFractionDigits: d, maximumFractionDigits: d });
    const STATUS_COLOR = { 0: '#7f8c8d', 1: '#95a5a6', 2: '#2ecc71', 3: '#3498db', 4: '#f1c40f', 5: '#1abc9c', 6: '#e74c3c', 7: '#e67e22' };

    function chip(id, show, ok, text, textId) {
        const el = $(id);
        el.classList.toggle('hide', !show);
        el.classList.toggle('ok', !!ok);
        el.classList.toggle('warn', show && !ok);
        if (textId) $(textId).textContent = text;
    }

    function handleMessage(data) {
        const s = JSON.parse(data);
        const root = $('root');

        if (s.theme) {
            document.body.classList.toggle('theme-dark', s.theme === 'dark');
            document.body.classList.toggle('theme-light', s.theme === 'light');
        }

        if (s.bg) {
            const has = !!s.bg.image;
            document.body.classList.toggle('has-bg', has);
            $('bg').style.backgroundImage = has ? 'url("' + s.bg.image + '")' : 'none';
            $('shade').style.setProperty('--dim', s.bg.dim);
        }

        // Kopf
        const statusText = s.statusText || (s.cable ? 'Kabel angeschlossen' : 'Geparkt');
        $('status').textContent = statusText;
        $('model').textContent = s.model || '';
        $('updated').textContent = s.ok ? 'Stand ' + s.updated : 'Verbindung prüfen';
        $('updated').classList.toggle('err', !s.ok);
        $('updated').title = s.error || '';
        root.style.setProperty('--s', STATUS_COLOR[s.status] || STATUS_COLOR[0]);
        root.classList.toggle('charging', s.status === 2);
        root.classList.toggle('cable', !!s.cable && s.status !== 2);

        // Akku-Ring: Farbe nach Füllstand
        const soc = (s.soc === null || s.soc === undefined) ? null : s.soc;
        $('soc').textContent = soc === null ? '–' : soc;
        const color = soc === null ? '#95a5a6' : (soc >= 50 ? '#2ecc71' : (soc >= 20 ? '#f1c40f' : '#e74c3c'));
        root.style.setProperty('--c', s.status === 2 ? '#2ecc71' : color);
        $('arc').setAttribute('stroke-dashoffset', (245 * (1 - (soc || 0) / 100)).toFixed(1));
        $('range').textContent = (s.rangeE !== null && s.rangeE !== undefined) ? fmt(s.rangeE) + ' km elektrisch' : '';

        // Ladeziel als Markierung am Ring (270°-Bogen ab 135°)
        const mark = $('targetMark');
        if (s.target && s.target < 100 && soc !== null) {
            const a = (s.target / 100) * 270;
            mark.style.display = '';
            mark.setAttribute('transform', 'rotate(' + (a + 90) + ' 60 60)');
        } else {
            mark.style.display = 'none';
        }

        // Fahrzeugbild
        const car = $('car');
        if (s.image && car.getAttribute('src') !== s.image) car.setAttribute('src', s.image);
        car.classList.toggle('on', !!s.image);

        // Sicherheit
        const hasLock = s.locked !== null && s.locked !== undefined;
        chip('chipLock', hasLock, s.locked, s.locked ? 'Verriegelt' : 'Entriegelt', 'lockText');
        $('shackle').setAttribute('d', s.locked ? 'M8 11V7a4 4 0 0 1 8 0v4' : 'M8 11V7a4 4 0 0 1 7.5-2');
        const hasDoors = s.doorsClosed !== null && s.doorsClosed !== undefined;
        chip('chipDoors', hasDoors, s.doorsClosed, s.doorsClosed ? 'Türen zu' : 'Tür offen', 'doorsText');
        const hasWin = s.winClosed !== null && s.winClosed !== undefined;
        chip('chipWin', hasWin, s.winClosed, s.winClosed ? 'Fenster zu' : 'Fenster offen', 'winText');
        chip('chipHome', s.atHome === true, true);

        // Laden
        let charge = statusText;
        if (s.status === 2 && s.timeLeft) {
            const h = Math.floor(s.timeLeft / 60), m = s.timeLeft % 60;
            setValue($('charge'), 'Lädt', 'noch ' + (h > 0 ? h + ' h ' : '') + m + ' min' + (s.target ? ' bis ' + s.target + ' %' : ''));
        } else {
            setValue($('charge'), charge, s.target && s.target < 100 ? 'Ziel ' + s.target + ' %' : '');
        }

        // Reichweite
        const parts = [];
        if (s.rangeE !== null && s.rangeE !== undefined) parts.push(fmt(s.rangeE) + ' km');
        const fuelRange = (s.rangeFuel !== null && s.rangeFuel !== undefined) ? 'Tank ' + fmt(s.rangeFuel) + ' km' : '';
        setValue($('rangeRow'), parts.join('') || (fuelRange ? '' : '–'), fuelRange);

        // Geöffnet (nur wenn etwas offen ist)
        const open = s.openParts && s.openParts !== 'Alles geschlossen';
        $('rowOpen').classList.toggle('hide', !open);
        if (open) $('open').textContent = s.openParts;

        // Standort
        const hasLoc = !!s.mapLink;
        $('rowLocation').classList.toggle('hide', !hasLoc);
        if (hasLoc) {
            const a = s.address;
            let text, small = '', title = '';
            if (a) {
                // Adresse statt Entfernung: „REWE · Hauptstraße 5“, klein „Osnabrück“ bzw. „Zu Hause“
                text = [a.name, a.street].filter(Boolean).join(' · ');
                small = s.atHome ? 'Zu Hause' : a.city;
                title = [a.name, a.street, a.city].filter(Boolean).join(', ');
            } else {
                text = s.atHome ? 'Zu Hause' : (s.distance !== null && s.distance !== undefined ? fmt(s.distance, 1) + ' km entfernt' : 'Karte');
            }
            const link = document.createElement('a');
            link.href = s.mapLink; link.target = '_blank'; link.rel = 'noopener noreferrer';
            link.textContent = text;
            link.title = title ? title + ' – auf Karte öffnen' : 'Auf Karte öffnen';
            // Kachel „Volvo Karte“ direkt in der Visualisierung öffnen (openObject ab Symcon 8.2)
            if (s.mapObject > 0 && typeof openObject === 'function') {
                link.addEventListener('click', (e) => { e.preventDefault(); openObject(s.mapObject); });
            }
            const loc = $('location');
            loc.textContent = '';
            loc.appendChild(link);
            if (small) {
                const sm = document.createElement('small');
                sm.textContent = small;
                loc.appendChild(sm);
            }
        }

        $('odo').textContent = (s.odometer !== null && s.odometer !== undefined) ? fmt(s.odometer) + ' km' : '–';
    }
</script>
